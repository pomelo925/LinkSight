[[permission]]
identifier = "allow-network-commands"
description = "Allows network diagnostic Tauri commands."
commands.allow = [
    "run_ping",
    "run_scan",
    "run_traceroute",
    "run_speedtest",
    "cancel_network_test",
    "run_connectivity_test",
    "local_list_dir",
    "local_mkdir",
    "local_rename",
    "local_remove",
    "local_set_permissions",
    "sftp_list_dir",
    "sftp_mkdir",
    "sftp_rename",
    "sftp_remove",
    "sftp_set_permissions",
    "sftp_upload",
    "sftp_download",
    "list_network_interfaces",
    "list_docker_images",
    "get_docker_overview",
    "docker_stop_container",
    "docker_restart_container",
    "docker_remove_container",
    "docker_rename_image",
    "docker_remove_image",
    "list_hosts",
    "save_host",
    "delete_host",
    "reorder_hosts",
    "verify_host",
    "validate_ssh_public_key",
    "validate_ssh_private_key",
    "persist_ssh_key_file",
    "read_local_key_file",
]
