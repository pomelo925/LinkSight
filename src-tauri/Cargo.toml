[package]
name = "linksight"
version = "1.2.2"
description = "Linux-first network diagnostics and connectivity analysis"
authors = ["pomelo925"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "linksight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }

# Serialization (camelCase to match the TS shared schema)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors, ids, time
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for the internet speed test (Cloudflare speed endpoints).
# `stream` enables chunked download/upload for real-time progress reporting.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
bytes = "1"

# Local storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SSH client — host verification and (future) remote sessions.
# `ring` backend instead of the default `aws-lc-rs` to avoid a cmake build dep.
russh = { version = "0.61", default-features = false, features = ["ring", "flate2", "rsa"] }

# SFTP subsystem client (rides on top of a russh channel) for the file browser.
russh-sftp = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
