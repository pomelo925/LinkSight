[package]
name = "linksight"
version = "0.1.0"
description = "Linux-first network diagnostics and connectivity analysis"
authors = ["pomelo925"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "linksight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }

# Serialization (camelCase to match the TS shared schema)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors, ids, time
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Local storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Future (Advanced Mode / Agent) ------------------------------------------
# SSH session management will use `russh`. Left out of the default build until
# the ssh module is implemented, to keep compile times fast during scaffolding.
# russh = "0.45"
# russh-keys = "0.45"

[features]
# Enable to compile the (future) SSH client backend.
ssh = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
