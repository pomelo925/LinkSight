################################################################################
# LinkSight - development compose
#
# Launched via ./run.sh (X11 forwarding + container lifecycle handled there).
################################################################################

x-common-settings: &common
  build:
    context: ..
    dockerfile: docker/dockerfile
  image: pomelo925/linksight:dev

  volumes:
    # GUI support (Tauri desktop window renders on the host X server)
    - "${XAUTHORITY:-$HOME/.Xauthority}:${XAUTHORITY:-$HOME/.Xauthority}"
    - "/tmp/.X11-unix:/tmp/.X11-unix"
    - "/etc/localtime:/etc/localtime:ro"

    # Host Docker daemon — Docker Stats talks to the host engine from inside
    # the dev container (requires the host `docker` CLI binary on PATH).
    - "/var/run/docker.sock:/var/run/docker.sock"
    - "/usr/bin/docker:/usr/bin/docker:ro"

    # Source tree (live editing from the host)
    - "..:/workspace"

    # Host home so local FS / SSH key browsing matches the real machine
    # (~, ~/.ssh, /home/<user>, …). Without this, the container's /home is empty.
    - "${HOME}:${HOME}"

    # Persist cargo & npm caches across container restarts
    - "linksight-cargo-registry:/usr/local/cargo/registry"
    - "linksight-node-modules:/workspace/node_modules"

  environment:
    - DISPLAY=${DISPLAY:-:0}
    - RUST_LOG=info
    # Use the host user's home inside the container (matches the volume mount).
    - HOME=${HOME}
    # Suppress GTK atk-bridge noise; WebKit a11y is handled via dbus-run-session
    # in scripts/dev.sh (NO_AT_BRIDGE alone does not silence WebKitWebProcess).
    - NO_AT_BRIDGE=1
    - GTK_MODULES=
    - LIBGL_ALWAYS_SOFTWARE=1
    # WebKitGTK rendering fixes for GPU-less containers / X11 forwarding.
    # The DMABUF renderer + accelerated compositing fall back to very slow
    # software paths here, causing input/repaint lag — disable them.
    - WEBKIT_DISABLE_DMABUF_RENDERER=1
    - WEBKIT_DISABLE_COMPOSITING_MODE=1

  # host networking is required so LAN scans, ping and iperf3 see real
  # interfaces rather than the docker bridge.
  network_mode: "host"

  # NET_RAW / NET_ADMIN let ping & nmap craft raw packets.
  cap_add:
    - NET_RAW
    - NET_ADMIN

  stdin_open: true
  tty: true
  stop_grace_period: 1s
  working_dir: /workspace

services:
  dev:
    <<: *common
    container_name: linksight-dev
    command: ["/bin/bash"]

volumes:
  linksight-cargo-registry:
  linksight-node-modules:
